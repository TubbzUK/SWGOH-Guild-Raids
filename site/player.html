<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player status · Guild Statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("raidTheme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js" defer></script>
<script src="tbscore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* One member's progress: pick a name, see a score for raids, territory battles and territory wars,
   then open any of them for that member's history and trend. Colours and fonts come from theme.css. */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px 48px; }
.card { padding: 16px 18px; min-width: 0; }
h2 { font: 700 13px var(--font-display); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
.up { color: var(--good-ink); } .down { color: var(--bad-ink); }
select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: 600 15px var(--font-ui); min-width: 0; }
.chooser { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }
.chooser label { font: 700 11px var(--font-display); letter-spacing: .16em; text-transform: uppercase; color: var(--text-2); }
.chooser select { flex: 1 1 260px; max-width: 420px; }
.stepbtn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 10px; width: 42px; height: 42px; font-size: 18px; cursor: pointer; flex: none; }
.stepbtn:hover { border-color: var(--accent); color: var(--accent); }
.chooser .pick { display: flex; gap: 6px; flex: 1 1 320px; max-width: 520px; }
.chooser .pick select { flex: 1; max-width: none; }
.welcome { text-align: center; padding: 42px 18px; }
.welcome h2 { font-size: 18px; margin-bottom: 8px; }
.welcome p { color: var(--text-2); margin: 0 auto; max-width: 52ch; }

/* overall + three areas */
.top { display: grid; grid-template-columns: minmax(220px, 1fr) 3fr; gap: 12px; margin-bottom: 12px; }
.areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 1000px) { .top { grid-template-columns: 1fr; } }
@media (max-width: 720px) { .areas { grid-template-columns: 1fr; } }
.overall .big { font: 800 46px var(--font-display); line-height: 1.05; margin: 8px 0 4px; color: var(--accent); }
.overall .note, .area .note { font-size: 12.5px; color: var(--text-2); }
.label { color: var(--text-2); font: 700 10.5px var(--font-display); text-transform: uppercase; letter-spacing: .16em; display: flex; align-items: center; gap: 8px; }
.mix { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin: 12px 0 8px; }
.mix i { display: block; height: 100%; }
.mixkey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); }
.mixkey span { display: inline-flex; align-items: center; gap: 5px; } .mixkey b { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
button.area { text-align: left; font: inherit; color: var(--text); cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 2px;
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
button.area:hover { border-color: var(--accent); transform: translateY(-1px); }
button.area[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--glow); }
button.area[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; transform: translateX(-50%) rotate(45deg);
  background: var(--surface-solid); border-right: 1px solid var(--accent); border-bottom: 1px solid var(--accent); }
@media (max-width: 720px) { button.area[aria-pressed="true"]::after { display: none; } }
.area .row1 { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 8px; }
.area .pct { font: 700 34px var(--font-display); line-height: 1; }
.area .pct small { display: block; font: 500 12px var(--font-ui); color: var(--text-2); margin-top: 4px; letter-spacing: 0; }
.area .open { margin-top: 8px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.area .ic { font-size: 14px; color: var(--accent); }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; position: relative; margin: 10px 0 6px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.meter u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-2); border-radius: 1px; text-decoration: none; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font: 600 12px var(--font-ui); white-space: nowrap; }
.b-good { background: var(--good-bg); color: var(--good-ink); }
.b-warn { background: var(--warn-bg); color: var(--warn-ink); }
.b-bad { background: var(--bad-bg); color: var(--bad-ink); }
.b-none { background: var(--none-bg); color: var(--text-2); }

/* detail */
.detail { margin-top: 14px; }
.dhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.dhead h2 { font-size: 16px; margin: 0; }
.dhead a { font-size: 13px; font-weight: 600; }
.verdict { margin: 0 0 14px; font-size: 14px; max-width: 80ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stats div { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.stats b { display: block; font: 700 18px var(--font-display); letter-spacing: .02em; }
.stats span { font-size: 12px; color: var(--text-2); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.grid2 > * { min-width: 0; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.chart { position: relative; height: 260px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--text-2); margin: 0 0 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sq { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.legend .ln { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.legend .ln.dash { border-top-style: dashed; }
.phrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.phrow button { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font: 600 13px var(--font-ui); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.phrow button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; white-space: nowrap; }
th { font: 700 10.5px var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); background: var(--surface-2); }
th.r, td.r { text-align: right; }
tbody tr { border-top: 1px solid var(--border); }
td.miss { color: var(--bad-ink); }
.ready { display: grid; gap: 10px; margin-bottom: 12px; }
.ready .rrow { display: grid; grid-template-columns: minmax(130px, 200px) 1fr auto; gap: 12px; align-items: center; }
.ready .rbar { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.ready .rbar i { display: block; height: 100%; border-radius: 5px; }
.ready .rname { font-weight: 600; }
.ready .rinfo { font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
@media (max-width: 600px) { .ready .rrow { grid-template-columns: 1fr auto; } .ready .rbar { grid-column: 1 / -1; grid-row: 2; } .overall .big { font-size: 38px; } }
.empty { color: var(--text-2); padding: 22px; text-align: center; }
.warnings { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
.warnings summary { cursor: pointer; font-weight: 600; }
.former { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
footer { color: var(--muted); font-size: 12px; margin-top: 28px; }
/* full roster */
.rosterbox { margin-top: 14px; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.rhead h2 { font-size: 16px; margin: 0; }
.rchips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.rchips span { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--text-2); }
.rchips b { color: var(--text); font: 700 14px var(--font-display); margin-right: 4px; }
.rtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.rtools input[type=search] { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font: 14px var(--font-ui); flex: 1 1 200px; max-width: 280px; min-width: 0; }
.rtools select { padding: 8px 10px; font-size: 13.5px; }
.rtools .phrow { margin: 0; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.unit { position: relative; background: var(--surface-2); border-radius: 10px; padding: 9px 10px 8px 13px; min-width: 0; display: flex; gap: 10px; align-items: center; }
.unit .ub { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.pf { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface); border: 2.5px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font: 700 14px var(--font-display); color: var(--text-2); }
.pf.ship { border-radius: 10px; }
.pf.r9 { border-color: #f5c542; } .pf.r7 { border-color: var(--good); } .pf.r5 { border-color: var(--accent); } .pf.r1 { border-color: var(--warn); } .pf.gl { box-shadow: 0 0 0 2px #f5c542, 0 0 10px rgba(245,197,66,.5); }
.unit::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--muted); }
.unit.L::before { background: #4c9bf0; } .unit.D::before { background: #e5484d; } .unit.gl { box-shadow: inset 0 0 0 1px #f5c542; }
.unit .un { font-weight: 600; font-size: 13px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.5em; }
.unit .um { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--text-2); }
.unit .lvl { font: 700 11.5px var(--font-num); padding: 1px 7px; border-radius: 999px; background: var(--none-bg); color: var(--text-2); white-space: nowrap; }
.unit .lvl.r9 { background: #f5c542; color: #2a1d00; } .unit .lvl.r7 { background: var(--good-bg); color: var(--good-ink); }
.unit .lvl.r5 { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); } .unit .lvl.r1 { background: var(--warn-bg); color: var(--warn-ink); }
.unit .st { color: #f5c542; letter-spacing: -1px; font-size: 11px; white-space: nowrap; } .unit .st i { color: var(--muted); font-style: normal; }
.rmore { margin-top: 10px; text-align: center; }
@media (max-width: 600px) { .units { grid-template-columns: 1fr 1fr; gap: 6px; } .unit { padding: 8px 8px 7px 11px; gap: 7px; } .pf { width: 36px; height: 36px; font-size: 12px; } .unit .un { font-size: 12.5px; } .unit .st { font-size: 9.5px; } }
.rmore button { border: 1px solid var(--border); background: var(--surface); color: var(--accent); border-radius: 8px; padding: 7px 16px; font: 600 13px var(--font-ui); cursor: pointer; }
:root { --c-plat: #8b5cf6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-plat: #c4a1ff; } }
:root[data-theme="dark"] { --c-plat: #c4a1ff; }
@media (max-width: 600px) { .ready .rinfo { white-space: normal; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="wordmark" href="./"><span data-emblem></span>Guild Statistics</a>
    <div class="top-actions">
      <a class="top-link" id="raidLink" href="./">⚔ Raids</a>
      <a class="top-link" id="tbLink" href="tb.html">◈ Territory battles</a>
      <a class="top-link" id="twLink" href="tw.html">✦ Territory wars</a>
      <a class="top-link" id="effLink" href="effectiveness.html">◎ Effectiveness</a>
      <span data-theme-toggle></span>
    </div>
  </div>
  <header class="banner">
    <div class="art" id="bannerArt"></div>
    <div>
      <div class="eyebrow" id="eyebrow">Player status</div>
      <h1 id="title">Player status</h1>
      <div class="sub" id="updated"></div>
    </div>
    <div class="banner-switch">
      <div class="pills" id="guildSwitch" role="group" aria-label="Guild" hidden></div>
    </div>
  </header>
  <div id="warnings"></div>

  <div class="card chooser">
    <label for="who">Your name</label>
    <div class="pick">
      <button type="button" class="stepbtn" id="prev" aria-label="Previous member" title="Previous member">‹</button>
      <select id="who"><option value="">Choose your name…</option></select>
      <button type="button" class="stepbtn" id="next" aria-label="Next member" title="Next member">›</button>
    </div>
  </div>

  <div class="card welcome" id="welcome">
    <h2>See how you're doing</h2>
    <p>Pick your name above for your score in raids, territory battles and territory wars, compared with the rest of the guild. Tap any of them for your history and trend.</p>
  </div>

  <div id="status" hidden>
    <div class="top">
      <div class="card overall" id="overall"></div>
      <div class="areas" id="areas"></div>
    </div>
    <section class="detail card" id="detail" aria-live="polite"></section>
    <section class="card rosterbox" id="roster"></section>
  </div>
  <footer id="foot"></footer>
</div>

<script>
(async function () {
  const $ = s => document.querySelector(s);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = s => String(s ?? "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const dfmt = s => new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const dshort = s => new Date(s + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" });
  const getJSON = u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  const { median } = TBScore;
  const P = v => v == null ? "–" : Math.round(v) + "%";
  const fmt = n => n == null ? "–" : Math.abs(n) >= 1e9 ? (n / 1e9).toFixed(2) + "B" : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(2) + "M" : Math.abs(n) >= 1e3 ? (n / 1e3).toFixed(1) + "K" : Math.round(n).toString();
  const int = n => n == null ? "–" : Math.round(n).toLocaleString("en-GB");
  const mean = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
  const slopeOf = ys => {
    const pts = ys.map((y, i) => [i, y]).filter(([, y]) => y != null);
    if (pts.length < 2) return null;
    const n = pts.length, xm = pts.reduce((a, p) => a + p[0], 0) / n, ym = pts.reduce((a, p) => a + p[1], 0) / n;
    const den = pts.reduce((a, p) => a + (p[0] - xm) ** 2, 0) || 1;
    return pts.reduce((a, p) => a + (p[0] - xm) * (p[1] - ym), 0) / den;
  };
  const trendBadge = (v, per) => v == null ? `<span class="badge b-none">● New</span>`
    : v >= 2 ? `<span class="badge b-good" title="Up about ${v.toFixed(1)} points per ${per}">▲ Rising</span>`
    : v <= -2 ? `<span class="badge b-bad" title="Down about ${Math.abs(v).toFixed(1)} points per ${per}">▼ Falling</span>`
    : `<span class="badge b-none" title="Within 2 points per ${per}">■ Steady</span>`;
  const band = v => v == null ? "var(--muted)" : v >= 75 ? css("--good") : v >= 50 ? css("--warn") : css("--bad");

  // ---------- data ----------
  const index = await getJSON("guilds.json");
  (function art() { if (!window.RaidTheme) return setTimeout(art, 30); RaidTheme.banner($("#bannerArt"), { slug: "player" }); })();
  const guilds = (index || []).filter(g => (g.tb && g.tb.count) || (g.tw && g.tw.count) || (g.raids || []).some(r => r.raids));
  let params = {}; try { params = Object.fromEntries(new URLSearchParams(location.search)); } catch (e) {}
  if (!guilds.length) { $("#updated").textContent = "No results uploaded yet."; return; }
  const guild = guilds.find(g => g.slug === params.guild) || guilds[0];
  const enc = encodeURIComponent, G = enc(guild.slug);
  const allRaidDefs = guild.raids || [];
  const [tbData, twData, tbSettings, saved0, ...allRaidData] = await Promise.all([
    guild.tb && guild.tb.count ? getJSON(`data/${G}/tb.json`) : null, guild.tw && guild.tw.count ? getJSON(`data/${G}/tw.json`) : null,
    getJSON(`data/${G}/tb-settings.json`), getJSON(`data/${G}/stats-settings.json`),
    ...allRaidDefs.map(r => getJSON(`data/${G}/${enc(r.slug)}.json`))]);
  const raidDefs = allRaidDefs.filter((r, k) => allRaidData[k] && allRaidData[k].raids.length);
  const raidData = raidDefs.map(r => allRaidData[allRaidDefs.indexOf(r)]);
  document.title = guild.name + " · Player status";
  $("#eyebrow").textContent = `${guild.name} · Player status`;
  $("#raidLink").href = "./?guild=" + G; $("#tbLink").href = "tb.html?guild=" + G; $("#effLink").href = "effectiveness.html?guild=" + G;
  $("#twLink").href = "tw.html?guild=" + G; $("#twLink").hidden = !twData; $("#tbLink").hidden = !tbData;
  const gp = $("#guildSwitch"); gp.hidden = guilds.length < 2;
  gp.innerHTML = guilds.map(g => `<button type="button" aria-pressed="${g.slug === guild.slug}" data-id="${esc(g.slug)}">${esc(g.name)}</button>`).join("");
  gp.querySelectorAll("button").forEach(b => b.onclick = () => { if (b.dataset.id !== guild.slug) location.search = "?guild=" + enc(b.dataset.id) + (selId ? "&player=" + enc(selId) : ""); });

  const tbs = tbData?.tbs || [];
  const nPh = tbs.length ? Math.max(...tbs.map(t => t.phases)) : 6;
  const TBS = TBScore.clean(tbSettings, nPh);
  const tbCache = tbs.map((_, i) => TBScore.scoreTB(tbData, TBS, i));
  const tws = twData?.tws || [];
  const twRef = tws.map((_, i) => Math.max(1, ...(twData?.players || []).map(p => p.total[i] || 0)));
  const raids = raidData.flatMap((d, k) => d.raids.map((r, i) => ({ ...r, raid: raidDefs[k].name, slug: raidDefs[k].slug, i, d })))
    .sort((a, b) => a.date.localeCompare(b.date) || a.raid.localeCompare(b.raid));
  raids.forEach(r => { r.ref = Math.max(1, ...r.d.players.map(p => p.scores[r.i] || 0)); });

  // members, matched across raid, TB and TW files by name
  const people = new Map();
  const person = (name, current) => {
    const k = norm(name);
    if (!people.has(k)) people.set(k, { id: k, name, current: false, raid: {}, ready: {} });
    const p = people.get(k); if (current) { p.current = true; p.name = name; }
    return p;
  };
  allRaidData.forEach((d, k) => d && d.players.forEach(pl => {
    const p = person(pl.name, pl.current);
    if (d.raids.length) p.raid[allRaidDefs[k].slug] = pl;
    if (pl.readiness && pl.current) p.ready[allRaidDefs[k].slug] = pl.readiness;
  }));
  (tbData?.players || []).forEach(pl => { const p = person(pl.name, pl.current); p.tbId = pl.id; p.tb = pl; });
  (twData?.players || []).forEach(pl => { const p = person(pl.name, pl.current); p.tw = pl; });

  // the same settings and scoring as the Guild effectiveness page
  const DEF = { weights: { raids: 45, tbs: 45, tws: 10 }, raids_last: 5, tbs_last: 3, tws_last: 3, include_tw: true };
  const S = (s => {
    const old = s && s.weights && s.weights.tws == null;
    const w = old && +s.weights.raids === 50 && +s.weights.tbs === 50 ? DEF.weights : { ...DEF.weights, ...(s?.weights || {}) };
    const n = (v, d) => Math.max(0, +(v ?? d) || 0);
    return {
      weights: { raids: n(w.raids, DEF.weights.raids), tbs: n(w.tbs, DEF.weights.tbs), tws: n(w.tws, DEF.weights.tws) },
      raids_last: Math.max(1, Math.round(+(s?.raids_last ?? DEF.raids_last) || DEF.raids_last)),
      tbs_last: Math.max(1, Math.round(+(s?.tbs_last ?? DEF.tbs_last) || DEF.tbs_last)),
      tws_last: Math.max(1, Math.round(+(s?.tws_last ?? DEF.tws_last) || DEF.tws_last)),
      include_tw: s?.include_tw == null ? DEF.include_tw : !!s.include_tw,
    };
  })(saved0);

      <div class="tablewrap"><table><thead><tr><th>TB</th><th class="r">Contribution</th><th class="r">Rank</th><th class="r">Territory points</th><th class="r">Waves</th><th class="r">Platoons</th><th class="r">Phases deployed</th></tr></thead><tbody>${idx.slice().reverse().map(i => {
        const me = sc(i);
        return me ? `<tr><td>${dfmt(tbs[i].date)}</td><td class="r num">${P(me.overall)}</td><td class="r num">#${rankAt(i)}</td><td class="r num">${fmt(t.tp[i])}</td><td class="r num">${int(t.waves[i])}</td><td class="r num">${int(t.platoons[i])}</td><td class="r num">${t.full_deploys[i] ?? "–"} / ${tbs[i].phases}</td></tr>`
          : `<tr><td>${dfmt(tbs[i].date)}</td><td class="r miss" colspan="6">Didn't take part</td></tr>`;
      }).join("")}</tbody></table></div>`;
    $("#detail").innerHTML = html;
    document.querySelectorAll("#tbPick button").forEach(b => b.onclick = () => { tbPick = +b.dataset.i; show(); });
    bar($("#c1"), { type: "bar", data: { labels: idx.map(i => dshort(tbs[i].date)), datasets: [
      { type: "line", label: "Guild median", data: idx.map(medAt), borderColor: css("--text-2"), borderWidth: 2, pointRadius: 0, tension: .25, order: 0 },
      { label: "You", data: idx.map(i => sc(i) ? sc(i).overall : 0), backgroundColor: idx.map(i => sc(i) ? a.color : css("--bad")), minBarLength: 3, borderRadius: 3, maxBarThickness: 34, order: 1 }] },
      options: { interaction: { mode: "index", intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.datasetIndex === 1 && !sc(idx[c.dataIndex]) ? " Didn't take part" : ` ${c.dataset.label}: ${P(c.raw)}` } } }, scales: { y: yPct, x: { grid: { display: false } } } } });
    if (tbPick != null) {
      const tb = tbs[tbPick], me = sc(tbPick), phs = Array.from({ length: tb.phases }, (_, k) => k + 1);
      const gmed = phs.map(n => median([...tbCache[tbPick].out.values()].map(v => v.ph[n]?.score)));
      bar($("#c2"), { type: "bar", data: { labels: phs.map(n => "P" + n + (TBS.phases.includes(n) ? "" : " ·")), datasets: [
        { label: "You", data: phs.map(n => me?.ph[n]?.score ?? 0), backgroundColor: a.color, borderRadius: 3, maxBarThickness: 26, minBarLength: 2 },
        { label: "Guild median", data: gmed, backgroundColor: css("--r3") || css("--grid"), borderRadius: 3, maxBarThickness: 26 }] },
        options: { plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: i => `Phase ${phs[i[0].dataIndex]}${TBS.phases.includes(phs[i[0].dataIndex]) ? "" : " (not counted)"}`,
          label: c => { if (c.datasetIndex) return ` Guild median: ${P(c.raw)}`; const p = me?.ph[phs[c.dataIndex]]; return p ? [` You: ${P(p.score)}`, ` Deployed ${P(p.dep)} · waves ${int(p.waves)}${p.spec != null ? " · special " + P(p.spec) : ""}`] : " Didn't take part"; } } } },
          scales: { y: yPct, x: { grid: { display: false } } } } });
    }
  }

  // ---------- territory wars ----------
  function twDetail(x, a) {
    const t = x.p.tw;
    let html = head(a, tws.length ? `tw.html?guild=${G}#members` : "", "Territory war page") + verdict(a, x, "TW banners")
      + (tws.length && !useTw ? `<p class="hint">Officers have territory wars switched off in the overall score, so this doesn't count towards your overall % right now.</p>` : "");
    if (!tws.length) { $("#detail").innerHTML = html + `<div class="empty">No territory wars uploaded yet.</div>`; return; }
    const seenI = x.ws.findIndex(v => v != null), idx = tws.map((tw, i) => i).filter(i => seenI >= 0 && i >= seenI);
    if (!idx.length) { $("#detail").innerHTML = html + `<div class="empty">No territory war results for you yet.</div>`; return; }
    const L = tws.length - 1, val = (k, i) => t ? t[k][i] : null;
    const res = r => r === "win" ? `<span class="badge b-good">Won</span>` : r === "loss" ? `<span class="badge b-bad">Lost</span>` : r === "draw" ? `<span class="badge b-none">Draw</span>` : "–";
    html += `<div class="stats">
        <div><b class="num">${val("total", L) == null ? "–" : int(val("total", L))}</b><span>Banners · ${dshort(tws[L].date)}</span></div>
        <div><b class="num">${val("defense", L) == null ? "–" : int(val("defense", L))}</b><span>Defence banners</span></div>
        <div><b class="num">${val("offense", L) == null ? "–" : int(val("offense", L))}</b><span>Offence banners</span></div>
        <div><b class="num">${val("rank", L) ? "#" + val("rank", L) : "–"}</b><span>Rank in the latest TW</span></div>
        <div><b class="num">${t?.avg == null ? "–" : int(t.avg)}</b><span>Average banners</span></div>
        <div><b class="num">${idx.filter(i => val("total", i) != null).length}/${idx.length}</b><span>TWs joined</span></div></div>
      <div class="grid2">
        <div><h2>Banners per TW</h2><div class="legend"><span><i class="sq" style="background:${css("--series-1")}"></i>Defence</span><span><i class="sq" style="background:${css("--series-2")}"></i>Offence</span><span><i class="ln" style="border-color:${css("--text-2")}"></i>Guild median</span></div><div class="chart"><canvas id="c1"></canvas></div></div>
        <div><h2>% of the guild's best</h2><p class="hint" style="margin-bottom:10px">100% = the most banners anyone in the guild got that TW; not joining counts 0</p><div class="chart"><canvas id="c2"></canvas></div></div>
      </div>
      <div class="tablewrap"><table><thead><tr><th>TW</th><th>Opponent</th><th>Result</th><th class="r">Defence</th><th class="r">Offence</th><th class="r">Banners</th><th class="r">Guild median</th><th class="r">Rank</th></tr></thead><tbody>${idx.slice().reverse().map(i => {
        const tw = tws[i], tot = val("total", i);
        return `<tr><td>${dfmt(tw.date)}</td><td>${esc(tw.opponent || "–")}</td><td>${res(tw.result)}</td>${tot == null ? `<td class="r miss" colspan="3">Didn't join</td>` : `<td class="r num">${int(val("defense", i))}</td><td class="r num">${int(val("offense", i))}</td><td class="r num"><b>${int(tot)}</b></td>`}<td class="r num">${int(tw.median_total)}</td><td class="r num">${val("rank", i) ? "#" + val("rank", i) : "–"}</td></tr>`;
      }).join("")}</tbody></table></div>`;
    $("#detail").innerHTML = html;
    const labels = idx.map(i => dshort(tws[i].date));
    bar($("#c1"), { type: "bar", data: { labels, datasets: [
      { type: "line", label: "Guild median", data: idx.map(i => tws[i].median_total), borderColor: css("--text-2"), borderWidth: 2, pointRadius: 0, tension: .25, order: 0 },
      { label: "Defence", data: idx.map(i => val("defense", i)), backgroundColor: css("--series-1"), stack: "b", borderRadius: 3, maxBarThickness: 34, order: 1 },
      { label: "Offence", data: idx.map(i => val("offense", i)), backgroundColor: css("--series-2"), stack: "b", borderRadius: 3, maxBarThickness: 34, order: 1 }] },
      options: { interaction: { mode: "index", intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: {
        title: i => { const tw = tws[idx[i[0].dataIndex]]; return `${dfmt(tw.date)}${tw.opponent ? " · vs " + tw.opponent : ""}`; },
        label: c => val("total", idx[c.dataIndex]) == null && c.datasetIndex ? " Didn't join" : ` ${c.dataset.label}: ${int(c.raw)}` },
        filter: c => !(c.datasetIndex === 2 && val("total", idx[c.dataIndex]) == null) } },
        scales: { y: { stacked: true, beginAtZero: true, grid: { color: css("--grid") }, border: { display: false } }, x: { stacked: true, grid: { display: false } } } } });
    bar($("#c2"), { type: "bar", data: { labels, datasets: [{ data: idx.map(i => x.ws[i]), backgroundColor: idx.map(i => x.ws[i] ? a.color : css("--bad")), minBarLength: 3, borderRadius: 3, maxBarThickness: 34 }] },
      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => x.ws[idx[c.dataIndex]] === 0 && val("total", idx[c.dataIndex]) == null ? " Didn't join (counts 0)" : ` ${P(c.raw)} of the guild's best` } } }, scales: { y: yPct, x: { grid: { display: false } } } } });
  }

  // ---------- full roster (characters and ships) ----------
  const GLS = new Set(["SUPREMELEADERKYLOREN", "GLREY", "GRANDMASTERLUKE", "SITHPALPATINE", "JEDIMASTERKENOBI", "LORDVADER", "JABBATHEHUTT", "GLLEIA", "GLAHSOKATANO", "GLHONDO"]);
  let RD = null, rdLoading = null, rType = "chars", rSort = "power", rQ = "", rSide = "", rAll = false;
  const loadRosters = () => rdLoading || (rdLoading = getJSON(`data/${G}/rosters.json`).then(d => { RD = d || { units: [], players: [] }; return RD; }));
  async function renderRoster(x) {
    const box = $("#roster"), id = x.p.id;
    if (!RD) { box.innerHTML = `<div class="rhead"><h2>Roster</h2></div><div class="empty">Loading…</div>`; await loadRosters(); if (selId !== id) return; }
    const pr = RD.players.find(p => norm(p.name) === id);
    if (!pr) { box.innerHTML = `<div class="rhead"><h2>Roster</h2></div><div class="empty">${RD.players.length ? "This member isn't in the latest roster." : "No roster yet: upload a WookieeBot roster export, or connect the guild to the game."}</div>`; return; }
    const U = pr.u.map(([i, stars, gear, relic, power, level]) => ({ ...RD.units[i], stars, gear, relic, power, level }));
    const chars = U.filter(u => !u.ship), ships = U.filter(u => u.ship), hasPow = U.some(u => u.power);
    if (!hasPow && rSort === "power") rSort = "relic";   // rosters pulled from the game have no per-unit power
    const cnt = f => chars.filter(f).length;
    const gls = chars.filter(u => GLS.has(u.id));
    box.innerHTML = `<div class="rhead"><h2>◆ Roster</h2><span class="hint" style="margin:0">${RD.updated ? "As of " + dfmt(RD.updated) : ""}</span></div>
      <div class="rchips">
        <span><b>${fmt(pr.gp)}</b>GP</span><span><b>${chars.length}</b>characters</span><span><b>${ships.length}</b>ships</span>
        <span><b>${gls.length}</b>Galactic Legend${gls.length === 1 ? "" : "s"}</span><span><b>${cnt(u => u.relic >= 9)}</b>at R9+</span>
        <span><b>${cnt(u => u.relic >= 7)}</b>at R7+</span><span><b>${cnt(u => u.gear >= 13)}</b>at G13</span><span><b>${ships.filter(u => u.stars >= 7).length}</b>7★ ships</span>
      </div>
      <div class="rtools">
        <div class="phrow" id="rType"><button type="button" data-v="chars" aria-pressed="${rType === "chars"}">Characters (${chars.length})</button><button type="button" data-v="ships" aria-pressed="${rType === "ships"}">Ships (${ships.length})</button></div>
        <input type="search" id="rQ" placeholder="Search units" value="${esc(rQ)}" aria-label="Search units">
        <select id="rSort" aria-label="Sort by">${[["power", "Power"], ["relic", rType === "ships" ? "Stars" : "Relic / gear"], ["stars", "Stars"], ["name", "Name"]].filter(o => !(rType === "ships" && o[0] === "stars") && (hasPow || o[0] !== "power")).map(([v, l]) => `<option value="${v}" ${v === rSort ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${rType === "chars" && chars.some(u => u.side) ? `<select id="rSide" aria-label="Side"><option value="">Light and dark</option><option value="L" ${rSide === "L" ? "selected" : ""}>Light side</option><option value="D" ${rSide === "D" ? "selected" : ""}>Dark side</option></select>` : ""}
      </div><div class="units" id="units"></div><div class="rmore" id="rMore"></div>`;
    const draw = () => {
      const q = rQ.trim().toLowerCase();
      const lvlRank = u => u.ship ? (u.stars || 0) : (u.relic || 0) * 100 + (u.gear || 0) * 2 + (u.stars || 0) / 10;
      const list = (rType === "ships" ? ships : chars).filter(u => (!q || u.name.toLowerCase().includes(q) || u.id.toLowerCase().includes(q)) && (rType === "ships" || !rSide || u.side === rSide))
        .sort((a, b) => rSort === "name" ? a.name.localeCompare(b.name) : rSort === "stars" ? (b.stars || 0) - (a.stars || 0) || lvlRank(b) - lvlRank(a)
          : rSort === "relic" ? lvlRank(b) - lvlRank(a) || (b.power || 0) - (a.power || 0) : (b.power || 0) - (a.power || 0) || lvlRank(b) - lvlRank(a));
      const first = innerWidth < 600 ? 24 : 60, shown = rAll || list.length <= first ? list : list.slice(0, first);
      const lvl = u => u.ship ? "" : u.gear >= 13 ? `<span class="lvl ${u.relic >= 9 ? "r9" : u.relic >= 7 ? "r7" : u.relic >= 5 ? "r5" : u.relic >= 1 ? "r1" : ""}">R${u.relic ?? 0}</span>` : `<span class="lvl">G${u.gear ?? "?"}</span>`;
      const stars = n => n == null ? "" : `<span class="st" title="${n} stars">${"★".repeat(n)}<i>${"★".repeat(Math.max(0, 7 - n))}</i></span>`;
      const tier = u => u.ship || u.gear < 13 ? "" : u.relic >= 9 ? "r9" : u.relic >= 7 ? "r7" : u.relic >= 5 ? "r5" : u.relic >= 1 ? "r1" : "";
      const ini = s => String(s).split(/[\s()'-]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
      const pf = u => { const cls = `pf ${u.ship ? "ship" : ""} ${tier(u)} ${GLS.has(u.id) ? "gl" : ""}`;
        return u.img ? `<img class="${cls}" src="${esc(u.img.startsWith("http") ? u.img : "https://game-assets.swgoh.gg/" + u.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-ini="${esc(ini(u.name))}">` : `<span class="${cls}">${esc(ini(u.name))}</span>`; };
      $("#units").innerHTML = shown.map(u => `<div class="unit ${u.side || ""} ${GLS.has(u.id) ? "gl" : ""}" title="${esc(u.name)}${u.level && u.level < 85 ? " · level " + u.level : ""}">${pf(u)}<div class="ub">
        <span class="un">${esc(u.name)}</span><span class="um">${stars(u.stars)}${lvl(u)}</span>
        <span class="um"><span>${u.power ? "Power " + int(u.power) : u.level ? "Level " + u.level : ""}</span>${GLS.has(u.id) ? '<span style="color:#f5c542;font-weight:700">GL</span>' : ""}</span></div></div>`).join("") || `<div class="empty" style="grid-column:1/-1">Nothing matches.</div>`;
      $("#units").querySelectorAll("img.pf").forEach(im => im.onerror = () => { const s = document.createElement("span"); s.className = im.className; s.textContent = im.dataset.ini; im.replaceWith(s); });
      $("#rMore").innerHTML = shown.length < list.length ? `<button type="button" id="rAllBtn">Show all ${list.length}</button>` : "";
      if ($("#rAllBtn")) $("#rAllBtn").onclick = () => { rAll = true; draw(); };
    };
    draw();
    document.querySelectorAll("#rType button").forEach(b => b.onclick = () => { rType = b.dataset.v; rAll = false; if (rType === "ships" && rSort === "stars") rSort = "relic"; renderRoster(x); });
    $("#rQ").oninput = e => { rQ = e.target.value; draw(); };
    $("#rSort").onchange = e => { rSort = e.target.value; draw(); };
    if ($("#rSide")) $("#rSide").onchange = e => { rSide = e.target.value; draw(); };
  }

  show();
  window.addEventListener("themechange", show);
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["raids", "tbs", "tws"].includes(h) && h !== area) { area = h; show(); } });
})();
</script>
</body>
</html>
